            - heading "Senior React Native Engineer" [level=1] [ref=f20e14]
            - generic [ref=f20e15]: Remote
          - button "Apply" [ref=f20e19] [cursor=pointer]
        - generic [ref=f20e21]:
          - paragraph [ref=f20e22]:
            - strong [ref=f20e23]: "Location:"
            - text: Remote — Anywhere (Open to applicants located anywhere around the globe)
          - paragraph [ref=f20e24]: Fueled is a leading digital strategy, design, and engineering agency. We are a 300+ person team that has designed and built hundreds of digital products and experiences for brands like Google, Apple, The New York Times, ESPN, Victoria’s Secret, MGM Resorts, Albertsons, and CLEAR.
          - paragraph [ref=f20e25]:
            - text: As a
            - strong [ref=f20e26]: Senior React Native Engineer
            - text: at Fueled, you will champion the power of React Native to architect, build, and scale high-performance, cross-platform mobile applications that deliver premium user experiences.
          - paragraph [ref=f20e27]: Drawing on your prior experience with React for the web, you’ll design end-to-end solutions utilizing React Native, Expo, TypeScript, and Node.js-based back-end integrations. You will rely on strong typing to create robust data models, state management, and application architecture for complex, business-oriented apps.
          - paragraph [ref=f20e28]: Additionally, you’ll integrate with REST/GraphQL APIs, implement effective caching strategies, and establish automated mobile CI/CD pipelines to ensure seamless testing, building, and deployment of reliable, real-time functionality at scale.
          - paragraph [ref=f20e29]: Your work will turn ambitious ideas into maintainable, future-ready mobile systems that evolve with client needs, raise the bar for quality and performance, and consistently drive measurable outcomes.
          - paragraph [ref=f20e30]: Intentionally remote and globally distributed across six continents, our team thrives in a culture that values flexibility, creativity, and cutting-edge technology. Together, we’re shaping the future of digital experiences.
          - heading "What you will do:" [level=3] [ref=f20e31]
          - list [ref=f20e32]:
            - listitem [ref=f20e33]: Architect and build polished, cross-platform mobile experiences that turn user engagement into lasting loyalty. You’ll apply modern React Native (Expo) patterns and tooling to deliver performant applications that feel truly native on iOS and Android.
            - listitem [ref=f20e34]: Own the end-to-end delivery of key product features, from concept to app store deployment and beyond. You won't just code tickets; you'll shape the technical approach, make critical architectural decisions, and ensure what we ship is robust, scalable, and maintainable.
            - listitem [ref=f20e35]: Elevate the team’s velocity and craft by introducing, validating, and championing tools and practices that raise the technical bar. You’ll proactively identify bottlenecks – whether in state management, native bridges, or CI/CD pipelines – and implement solutions that make the entire team more effective.
            - listitem [ref=f20e36]: Bridge the gap between ambitious creative vision and technical reality in a mobile context. You’ll collaborate closely with designers and strategists to challenge assumptions, explore what’s possible on mobile, and deliver solutions that balance exceptional user experience with a first-class developer experience.
          - heading [level=3] [ref=f20e37]:
            - strong [ref=f20e38]: "What you will achieve:"
          - list [ref=f20e39]:
            - listitem [ref=f20e40]: From Day 1, you’re shipping a tangible feature for a live client project, building immediate momentum.
            - listitem [ref=f20e41]: Within the first month, you’ll own and deliver a key mobile feature end-to-end and improve a core performance metric (like app startup time or frame rate) by at least 10%.
            - listitem [ref=f20e42]: You will enhance team efficiency by creating reusable components, scripts, or processes that are adopted by your peers.
            - listitem [ref=f20e43]: By end of the project, you’ll have spearheaded a significant project phase from concept to app store launch, on time and to a high standard.
            - listitem [ref=f20e44]: Your expertise becomes a multiplier, evidenced by positive client or team feedback on your ability to solve complex mobile challenges.
          - heading "About you:" [level=3] [ref=f20e45]
          - list [ref=f20e46]:
            - listitem [ref=f20e47]: You think in cross-platform systems and reusable components. You get genuine satisfaction from designing a React Native architecture that is intuitive, performant, and delivers a consistent, high-quality experience on both iOS and Android.
            - listitem [ref=f20e48]: You’re a proactive problem-solver who doesn’t wait for perfect requirements. You thrive on digging into ambiguity, asking "why," and prototyping solutions to complex challenges involving native modules, third-party SDKs, and smooth data flow.
            - listitem [ref=f20e49]: You have a strong point of view, held loosely. You can articulate a compelling case for a specific technology or architectural approach (like state management libraries or navigation patterns) but are equally committed to the team's final decision and its success.
            - listitem [ref=f20e50]: You see the "full stack" as a single, interconnected challenge. You're comfortable crafting a polished, dynamic mobile UI with React Native and then diving into the back-end logic, API design, or platform-specific native code that makes it all possible.
            - listitem [ref=f20e51]: You are a natural collaborator and translator, able to explain mobile-specific constraints to designers and strategic goals to other engineers, ensuring the entire multidisciplinary team is building momentum together.
          - heading "Contractor Fee" [level=3] [ref=f20e52]
          - paragraph [ref=f20e53]: Compensation is determined based on a variety of factors including relevant experience, projects, geographic location, and business needs.
          - heading "Join our Contractor Pool" [level=3] [ref=f20e54]
          - paragraph [ref=f20e55]: This role is designed as a contract position, offering you the opportunity to experience our team and culture while showcasing your contributions. When the fit and business needs align, some contractors are invited to explore a transition into full-time roles.
          - paragraph [ref=f20e56]: If you are passionate about Fueled's mission and think you have what it takes to be successful in this role, please apply. We'd appreciate the opportunity to review your application. Everyone gets a response.
          - paragraph [ref=f20e57]: Upon meeting the necessary criteria, you'll join the Fueled contractor network, granting you access to project invitations tailored to your expertise and availability when they arise.
          - paragraph [ref=f20e58]:
            - text: Any data provided will be processed in accordance with applicable law and our
            - link "privacy policy" [ref=f20e59] [cursor=pointer]:
              - /url: https://fueled.com/privacy-policy/
            - text: . Curious about what to expect during our talent process? Check it out
            - link "here" [ref=f20e60] [cursor=pointer]:
