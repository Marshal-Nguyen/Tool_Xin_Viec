            - text: ". #LI-Remote"
          - paragraph [ref=f20e61]:
            - text: We don't want you to miss any communication from us! To ensure you receive updates on your application, please add
            - link "jobs@fueled.com" [ref=f20e62] [cursor=pointer]:
              - /url: mailto:jobs@fueled.com
            - text: to your contacts list!
