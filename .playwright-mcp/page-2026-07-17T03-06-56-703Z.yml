                - paragraph [ref=f10e120]:
                  - strong [ref=f10e121]: About Digital Unicorn
                - paragraph [ref=f10e122]: Digital Unicorn is a mobile and web development agency focused on creating great digital products that truly matter to our customers. We work closely with startups, scale-ups, and established companies to design and build high-quality applications with strong product thinking, clean execution, and long-term value in mind.
                - paragraph [ref=f10e123]: Our team is international, highly motivated, and hands-on. We value ownership, clarity, and craftsmanship. We keep things practical, move fast, and expect everyone to contribute directly to the success of our projects and our clients.
                - paragraph [ref=f10e124]: We believe great products come from people who care deeply about users, quality, and collaboration.
                - paragraph [ref=f10e125]
                - paragraph [ref=f10e126]:
                  - strong [ref=f10e127]: About the Role
                - paragraph [ref=f10e128]: We are looking for a Mobile Developer (React Native) to join our growing delivery team and work on high-impact client projects.
                - paragraph [ref=f10e129]: You will be involved in building, improving, and maintaining real-world products used by real users. At any given time, you will focus on the most important product or technical challenge for your project.
                - paragraph [ref=f10e130]: This role is ideal for someone who enjoys taking responsibility, working closely with PMs, designers, and other engineers, and turning ideas into reliable, well-crafted software.
