        - heading [level=1] [ref=f37e11]:
          - strong [ref=f37e12]: Join Sekai to build the TikTok for mini apps
        - paragraph [ref=f37e13]: Sekai is an AI-driven consumer platform where people create, remix, share, and play interactive content instantly. We are building the next generation of consumer social products — where content is not just watched, but played, remixed, and rebuilt by the community.
        - paragraph [ref=f37e14]: Our product sits at the intersection of AI, social, and interactive entertainment. Users can describe what they want to create, and Sekai turns that idea into a playable mini app — from games and quizzes to interactive stories, tools, and viral social experiences.
        - paragraph [ref=f37e15]: We are a Series A company backed by leading investors including Khosla, a16z, Mayfield, and A*, with $30M raised to date.
        - paragraph [ref=f37e16]: We are a remote-first team across all positions. We offer competitive salaries plus equity, full medical and health insurance benefits, and the opportunity to join an ambitious, AI-native team building a real consumer app at the frontier of AI.
        - paragraph [ref=f37e17]: At Sekai, you will work with people who move fast, use AI deeply in how they build and operate, and constantly learn from the latest developments in the AI world. You will have strong ownership, flexibility to explore, and the chance to help shape a new category from an early stage.
